; ESP32 bridge: LSM6DSV16X (I2C) -> official 12-byte IMU block -> UART to the Pi.
; Build & flash:  pio run -e esp32dev -t upload
; Change the environment for your board (esp32-s3-devkitc-1, esp32-c3-devkitm-1, ...) and
; the pin defines in build_flags to match your wiring.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -DIMU_SDA=21
  -DIMU_SCL=22
  -DLINK_TX=17
  -DLINK_RX=16
  -DLINK_BAUD=921600
  -DLINK_USB=0
